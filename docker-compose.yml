services:
  jenkins:
    image: myjenkins-blueocean:2.580-jdk21
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      - docker-proxy
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
    ports:
      - "8081:8080"
      - "50000:50000"
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ${NETWORK_TYPE:-ipv4}

  docker-proxy:
    image: alpine/socat
    command: tcp-listen:2375,fork,reuseaddr,bind=0.0.0.0 unix-connect:/var/run/docker.sock
    restart: always
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ${NETWORK_TYPE:-ipv4}

  sonarqube:
    profiles: [analysis]
    image: sonarqube:community
    hostname: sonarqube
    container_name: sonarqube
    mem_limit: 2g
    cpus: 1.5
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:
      - /tmp:size=256M,mode=1777
    ports:
      - "9000:9000"
    networks:
      - ${NETWORK_TYPE:-ipv4}

  db:
    image: postgres:17
    mem_limit: 512m
    cpus: 0.5
    hostname: postgresql
    container_name: postgresql
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgresql:/var/lib/postgresql
    networks:
      - ${NETWORK_TYPE:-ipv4}

  nexus:
    profiles: [artifacts]
    image: sonatype/nexus3:3.96.0-alpine
    mem_limit: 1g
    cpus: 2.0
    volumes:
      - nexus_data:/nexus-data
    ports:
      - "8082:8081"
    networks:
      - ${NETWORK_TYPE:-ipv4}

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_temp:
  sonarqube_extensions:
  sonarqube_logs:
  nexus_data:
  postgresql:

networks:
  ipv4:
    driver: bridge
    enable_ipv6: false
  dual:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "192.168.2.0/24"
          gateway: "192.168.2.1"
        - subnet: "2001:db8:2::/64"
          gateway: "2001:db8:2::1"
